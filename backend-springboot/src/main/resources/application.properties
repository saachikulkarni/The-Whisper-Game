# Dynamic port binding for Render ($PORT) with fallback to 8080 locally
server.port=${PORT:8080}
spring.application.name=the-whisper-game

# MongoDB Connection String (supplied via MONGODB_URI on Render or MongoDB Atlas)
spring.data.mongodb.uri=${MONGODB_URI:}

# Serve static web frontend
spring.web.resources.static-locations=classpath:/static/,file:../client/,file:client/
